name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Contract tests with real Groth16 proofs
        run: npm test

      - name: Server typecheck
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Web production build
        run: npm run build -w web

      - name: Isolated HTTP integration tests
        run: npm run test:integration
